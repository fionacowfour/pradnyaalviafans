<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pradnya Alvia Fans</title>
  
  <!-- ==================== STYLE ==================== -->
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* Container HP */
    .phone {
      width: 100%;
      max-width: 390px;
      background: #121212;
      min-height: 100vh;
      border-left: 1px solid #1f1f1f;
      border-right: 1px solid #1f1f1f;
    }

    /* ===== HEADER ===== */
    .header {
      height: 150px;
      background: linear-gradient(180deg, #1e1040 0%, #2d1b5e 60%, #1a0a2e 100%);
      position: relative;
      overflow: hidden;
    }

    /* Garis neon ungu */
    .header::after {
      content: "";
      position: absolute;
      top: 32%;
      left: -10%;
      right: -10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #a78bfa, transparent);
      box-shadow: 0 0 15px #a78bfa;
      transform: rotate(-4deg);
    }

    /* ===== CONTENT ===== */
    .content {
      padding: 0 20px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Foto Profil */
    .avatar-wrap {
      width: 116px;
      height: 116px;
      margin-top: -58px;
      border-radius: 50%;
      padding: 4px;
      background: #121212;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
      position: relative;
      z-index: 10;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #222;
    }

    /* Nama */
    .name {
      color: white;
      font-weight: 800;
      font-size: 24px;
      margin-top: 14px;
      text-align: center;
      line-height: 1.2;
    }

    /* Role */
    .role {
      color: #9a9a9a;
      font-size: 13px;
      margin-top: 6px;
      text-align: center;
    }

    /* ===== VIDEO TUTORIAL ===== */
    .video-wrap {
      width: 100%;
      margin-top: 22px;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      border: 1px solid #2a2a2a;
      box-shadow: 0 8px 24px rgba(99,102,241,0.25);
    }

    .video-wrap video {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      display: block;
    }

    /* ===== CONTACT ME ===== */
    .section-title {
      color: white;
      font-weight: 800;
      font-size: 18px;
      margin-top: 28px;
      width: 100%;
      text-align: center;
    }

    .cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }

    .contact-link {
      text-decoration: none;
      width: 100%;
      display: block;
    }

    .card {
      width: 100%;
      background: #232323;
      border: 1px solid #2e2e2e;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s ease;
    }

    .contact-link:hover .card {
      background: #2b2b2b;
      border-color: #3a3a3a;
      transform: translateY(-1px);
    }

    .icon-box {
      width: 50px;
      height: 50px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-box.whatsapp {
      background: #25D366;
    }

    .icon-box.telegram {
      background: #2AABEE;
    }

    .icon-box svg {
      width: 26px;
      height: 26px;
      fill: white;
    }

    .card-text {
      flex: 1;
    }

    .card-title {
      color: white;
      font-weight: 700;
      font-size: 15px;
    }

    .card-sub {
      color: #8a8a8a;
      font-size: 12px;
      margin-top: 3px;
    }

    .card-arrow {
      color: #555;
      font-size: 22px;
      padding-left: 8px;
    }

    .footer {
      margin-top: 28px;
      color: #444;
      font-size: 11px;
      text-align: center;
      width: 100%;
      padding-bottom: 10px;
    }
  </style>
</head>
